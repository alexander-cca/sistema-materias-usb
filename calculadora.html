<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<style>
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#1e293b}
main{max-width:430px;margin:30px auto;padding:16px}
.card{background:white;border-radius:14px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
h1{color:#3730a3}
#o{width:100%;box-sizing:border-box;padding:13px;text-align:right;font-size:28px;border:1px solid #cbd5e1;border-radius:9px;margin-bottom:12px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{padding:14px;border:0;border-radius:9px;background:#e2e8f0;font-weight:700;font-size:17px;cursor:pointer}
.op{background:#4f46e5;color:white} .fib{width:100%;margin-top:10px;background:#e11d48;color:white}
</style></head>
<body>
<nav style="background:#3730a3;color:white;padding:14px 18px;font-family:Arial,sans-serif">
  <div style="max-width:1000px;margin:auto;display:flex;gap:18px;flex-wrap:wrap">
    <a href="registro.html" style="color:white;text-decoration:none;font-weight:700">Registro</a>
    <a href="calculadora.html" style="color:white;text-decoration:none;font-weight:700">Calculadora</a>
    <a href="mascotas.html" style="color:white;text-decoration:none;font-weight:700">Mascotas</a>
  </div>
</nav>

<main><div class="card"><h1>Calculadora</h1><p>Operaciones básicas y serie Fibonacci.</p><input id="o" value="0" readonly><div id="k" class="keys"></div><button class="fib" id="fb">Generar Fibonacci</button><div id="r" style="margin-top:12px;word-break:break-word"></div></div></main>
<script>
const keys=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'];let a='';
k.innerHTML=keys.map(v=>`<button class="${'+-*/='.includes(v)?'op':''}" data-v="${v}">${v.replace('*','×').replace('/','÷')}</button>`).join('');
k.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v;if(v==='C'){a='';o.value='0';return}if(v==='='){try{o.value=Function('return '+a)();a=String(o.value)}catch{o.value='Error';a=''}return}a+=v;o.value=a});
fb.addEventListener('click',()=>{let n=parseInt(o.value);if(!Number.isInteger(n)||n<1||n>100){r.textContent='Ingrese un entero entre 1 y 100';return}let z=[0,1];for(let i=2;i<n;i++)z.push(z[i-1]+z[i-2]);r.textContent=z.slice(0,n).join(', ')});
</script>
</body></html>
